name: PKG
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# purpose: Continuous Delivery (aka Packaging & Shipping)

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: "${{ github.ref }}-pkg"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  npm-publication:
    name: "Package yamlctl"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: the package is published with a short-lived OIDC token rather than a stored secret
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # writes the .npmrc that npm publish reads,
          # so the OIDC exchange knows which registry to present the token to
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Publish NPM package
        uses: devpro/github-workflow-parts/actions/npm/publish@c6d06a61a377a41dc192ce58f08a0b5100d9a2bc
