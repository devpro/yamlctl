name: PKG
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# purpose: Continuous Delivery (aka Packaging & Shipping)

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: "${{ github.ref }}-pkg"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  npm-publication:
    name: "Package yamlctl"
    permissions:
      contents: read
      # npm trusted publishing: the package is published with a short-lived OIDC token rather than a stored secret
      id-token: write
    uses: devpro/github-workflow-parts/.github/workflows/reusable-npm-publication.yml@13ac7ccf4ba593797f8c80a75f2559ce0fc2d09e
    with:
      workflow-parts-version: 13ac7ccf4ba593797f8c80a75f2559ce0fc2d09e
