name: CI
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# purpose: Continuous Integration pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: "${{ github.ref }}-ci"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markup-lint:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@591b0c7bfba6fbc7b0cab7d896447e0732b819de

  test:
    name: "Test on Node.js ${{ matrix.node-version }}"
    strategy:
      matrix:
        node-version: ["22", "24", "26"]
    uses: devpro/github-workflow-parts/.github/workflows/reusable-node-quality.yml@591b0c7bfba6fbc7b0cab7d896447e0732b819de
    with:
      # The package installs and runs, and yamlctl checks the workflows of this repository against their schema.
      custom-tests: |
        npm run smoke
        node bin/yamlctl.js -C .github/workflows check
      job-name: Test on Node.js ${{ matrix.node-version }}
      node-version: ${{ matrix.node-version }}
      timeout-minutes: 10
      workflow-parts-version: 591b0c7bfba6fbc7b0cab7d896447e0732b819de
